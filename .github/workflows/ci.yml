# Commit -> checks -> image (tagged with the commit SHA) -> deploy test on kind -> approved publish to GHCR.
name: ci
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:

permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
env:
  IMAGE: ghcr.io/om-midya/notes-devops

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: notes }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt pytest==9.1.1 ruff==0.17.1 pip-audit==2.9.0
      - name: Lint (includes bandit security rules)
        run: ruff check . && ruff format --check .
      - name: Unit + integration tests against Postgres
        run: pytest -q
        env: { DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/notes" }
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # Scanners run from pinned images, not marketplace actions (trivy-action tags were hijacked in 2026).
      - name: Secret scan (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --no-banner
      - name: Misconfiguration scan (Dockerfile + rendered Helm chart)
        run: docker run --rm -v "$PWD:/src" aquasec/trivy:0.65.0 config --exit-code 1 --severity HIGH,CRITICAL --helm-set image.tag=ci /src

  build-and-deploy-test:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image tagged with the commit SHA
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" --build-arg APP_VERSION="$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" .
      - name: Image vulnerability gate
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:v0.100.0 "$IMAGE:$GITHUB_SHA" --only-fixed --fail-on high
      - uses: azure/setup-helm@v4
        with: { version: v4.3.1 }
      - uses: helm/kind-action@v1
        with: { cluster_name: notes, config: kind-config.yaml }
      - name: Deploy chart exactly as deploy.sh does (restricted PSA, generated secret)
        run: |
          kind load docker-image "$IMAGE:$GITHUB_SHA" --name notes
          kubectl create namespace notes
          kubectl label namespace notes pod-security.kubernetes.io/enforce=restricted
          kubectl -n notes create secret generic notes-db --from-literal=password="$(openssl rand -hex 24)"
          helm lint chart/notes --set image.tag="$GITHUB_SHA"
          helm install notes chart/notes -n notes --set image.tag="$GITHUB_SHA" --set autoscaling.enabled=false --wait --timeout 4m
      - name: User journey smoke test + version check
        run: |
          helm test notes -n notes --logs
          test "$(curl -fsS localhost:8080/version)" = "{\"version\":\"$GITHUB_SHA\"}"
      - name: Debug on failure
        if: failure()
        run: kubectl -n notes get all,events; kubectl -n notes logs -l app.kubernetes.io/part-of=notes --all-containers --tail=50
      - name: Save tested image
        run: docker save "$IMAGE:$GITHUB_SHA" | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: image, path: image.tar.gz, retention-days: 3 }

  publish:
    needs: build-and-deploy-test
    # Publishing is the release step: it pauses for manual approval on the "release" environment.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: release
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: image }
      - name: Push the exact image that passed the deploy test
        run: |
          gunzip -c image.tar.gz | docker load
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          echo "Published $IMAGE:$GITHUB_SHA. Deploy locally with: ./deploy.sh $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
