# Commit -> checks -> one multi-arch image tagged with the commit SHA -> scan + deploy test on kind -> approved promotion to :stable.
name: ci
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:

permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
env:
  IMAGE: ghcr.io/om-midya/notes-devops
  # On PRs github.sha is a temporary merge commit; tag images with the real branch commit instead.
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: notes }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt pytest==9.1.1 ruff==0.17.1 pip-audit==2.9.0
      - name: Lint (includes bandit security rules)
        run: ruff check . && ruff format --check .
      - name: Unit + integration tests against Postgres
        run: pytest -q
        env: { DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/notes" }
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # Scanners run from pinned images, not marketplace actions (trivy-action tags were hijacked in 2026).
      - name: Secret scan (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --no-banner
      - name: Misconfiguration scan (Dockerfile + rendered Helm chart)
        run: docker run --rm -v "$PWD:/src" aquasec/trivy:0.65.0 config --exit-code 1 --severity HIGH,CRITICAL --helm-set image.tag=ci /src

  build-and-deploy-test:
    needs: [test, security]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.SHA }}" }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build once (amd64 + arm64), tag with the commit SHA, push
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push -t "$IMAGE:$SHA" \
            --build-arg APP_VERSION="$SHA" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$SHA" \
            --cache-from type=gha --cache-to type=gha,mode=max .
      - name: Image vulnerability gate
        run: docker run --rm anchore/grype:v0.100.0 "registry:$IMAGE:$SHA" --only-fixed --fail-on high
      - uses: azure/setup-helm@v4
        with: { version: v4.3.1 }
      - uses: helm/kind-action@v1
        with: { cluster_name: notes, config: kind-config.yaml }
      - name: Deploy the pushed image exactly as deploy.sh does (restricted PSA, generated secret)
        run: |
          kubectl create namespace notes
          kubectl label namespace notes pod-security.kubernetes.io/enforce=restricted
          kubectl -n notes create secret generic notes-db --from-literal=password="$(openssl rand -hex 24)"
          helm lint chart/notes --set image.tag="$SHA"
          helm install notes chart/notes -n notes --set image.tag="$SHA" --set autoscaling.enabled=false --wait --timeout 4m
      - name: User journey smoke test + version check
        run: |
          helm test notes -n notes --logs
          test "$(curl -fsS localhost:8080/version)" = "{\"version\":\"$SHA\"}"
          echo "Built, scanned and deploy-tested \`$IMAGE:$SHA\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Debug on failure
        if: failure()
        run: kubectl -n notes get all,events; kubectl -n notes logs -l app.kubernetes.io/part-of=notes --all-containers --tail=50

  release:
    needs: build-and-deploy-test
    # Manual approval on the "release" environment, then promote the tested digest to :stable (no rebuild).
    environment: release
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: |
          docker buildx imagetools create -t "$IMAGE:stable" "$IMAGE:$SHA"
          echo "Released \`$IMAGE:$SHA\` as :stable. Deploy: \`./deploy.sh $SHA\`" >> "$GITHUB_STEP_SUMMARY"
