{{- if .Values.tracing.enabled }}
# Jaeger all-in-one with in-memory storage: traces are lost on restart (fine for local).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-jaeger
  labels: {{- include "notes.labels" . | nindent 4 }}
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: jaeger }
  template:
    metadata:
      labels:
        {{- include "notes.labels" . | nindent 8 }}
        app.kubernetes.io/name: jaeger
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: jaeger
          image: {{ .Values.tracing.image }}
          ports: [{ name: otlp-http, containerPort: 4318 }, { name: ui, containerPort: 16686 }]
          readinessProbe:
            httpGet: { path: /, port: ui }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 512Mi }
          securityContext: {{- include "notes.securityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-jaeger
  labels: {{- include "notes.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: jaeger }
  ports: [{ name: otlp-http, port: 4318 }, { name: ui, port: 16686 }]
{{- end }}
